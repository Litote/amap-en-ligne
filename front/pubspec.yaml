name: amap_en_ligne
description: 'Amap en Ligne — offline-first producer-side CSA management app.'
publish_to: 'none'

# Semver bumped by release-please (which rewrites the whole token, dropping
# any +N suffix — expected). CI stamps the real build number via
# --build-number (run number) so installed builds stay traceable.
version: 0.0.0+1 # x-release-please-version

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  # Auth providers — Dart-only Cognito client (no native plugins, web-friendly).
  # GoTrue is consumed directly via dio in data/auth/gotrue_auth_service.dart.
  amazon_cognito_identity_dart_2: 4.0.1
  archive: 4.3.0
  bloc: 9.2.1
  connectivity_plus: 7.3.1
  cupertino_icons: 1.0.9
  dio: 5.11.1
  drift: 2.35.0
  drift_flutter: 0.3.1
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: 3.1.0
  go_router: 18.0.1
  google_fonts: 8.2.1
  intl: 0.20.3
  json_annotation: 4.12.0
  logger: 2.8.0
  package_info_plus: 10.2.1
  path_provider: 2.1.6
  pdf: 3.13.1
  printing: 5.15.1
  sentry_flutter: 9.30.1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  web: 1.1.1

dev_dependencies:
  bloc_test: 10.0.0
  build_runner: 2.16.1
  drift_dev: 2.35.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  http: 1.6.0
  integration_test:
    sdk: flutter
  json_serializable: 6.14.1
  mocktail: 1.0.5
  path_provider_platform_interface: 2.1.3
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/wordmark.svg

module:
  androidX: true
