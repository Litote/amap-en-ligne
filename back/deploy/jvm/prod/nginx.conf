# Production nginx of the web image: serves the Flutter web app and routes the API and
# GoTrue on the same origin (the web client discovers its server at
# <origin>/.well-known/amap-en-ligne.json). TLS is terminated upstream by Caddy.
# Derived from ../nginx.conf (dev `web` profile) — keep the static-asset rules aligned.
server {
    listen 80;
    root /usr/share/nginx/html;

    # API routes → Ktor (no COOP/COEP headers on API responses)
    location ~ ^/(v1|\.well-known)/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 35s;
    }

    # GoTrue's admin API is only used from the internal network (back, create-owner.sh).
    location ^~ /auth/admin {
        return 404;
    }

    # GoTrue (login, refresh, password recovery) → prefix stripped: /auth/token → /token.
    location ^~ /auth/ {
        proxy_pass         http://gotrue:9999/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 35s;
    }

    # Flutter WASM / JS bundles. Unlike the dev conf, never cached as immutable: Flutter web
    # file names carry no content hash (main.dart.wasm, flutter_bootstrap.js,
    # flutter_service_worker.js…), so a long TTL would pin users on an old release after an
    # update. `no-cache` = always revalidate; unchanged files cost a 304 thanks to the ETag.
    # Note: nginx add_header does not inherit from parent blocks when the
    # child block defines its own add_header, so COOP/COEP must be repeated.
    location ~* \.(wasm|m?js)$ {
        types {
            application/wasm       wasm;
            text/javascript        js mjs;
        }
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback — short TTL so service worker updates propagate
    location / {
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
