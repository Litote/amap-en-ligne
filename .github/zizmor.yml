rules:
  dangerous-triggers:
    ignore:
      # pull_request_target is intentional. The version files of the PR change the
      # code that the build runs, so the jobs that run it have no secret and no write
      # access; the jobs that hold the App token run no build and only take the
      # expected paths from their artifact.
      - dependabot-gradle-verification.yml:3
      - dependabot-flutter-lock.yml:3

  bot-conditions:
    ignore:
      # Restricting to dependabot[bot] is the intended guard for these workflows.
      - dependabot-gradle-verification.yml:17
      - dependabot-flutter-lock.yml:18
