version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      exclude:
        - "Litote/*"
    groups:
      # A release of Litote/ci updates several workflows and actions: bump them in a single PR
      litote-ci:
        patterns:
          - "Litote/ci/*"
    labels:
      - dependencies
      - github-actions

  # ── Gradle (back, root version catalog: gradle/libs.versions.toml) ────────
  # A single entry for both directories, so that an update of both opens a single PR
  - package-ecosystem: gradle
    directories:
      - /back
      - /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - backend
    groups:
      # The DynamoDB mapper (aws-dynamodb), the SDK clients (aws-sdk-kotlin), the smithy
      # runtime and aws-crt are released together and must resolve to aligned versions:
      # bump them in a single PR instead of one PR per catalog entry.
      aws-sdk:
        patterns:
          - "aws.sdk.kotlin*"
          - "aws.smithy.kotlin*"
          - "software.amazon.awssdk.crt*"

  # ── Flutter / Dart (pub) ────────────────────────────────────────────────────
  - package-ecosystem: pub
    directory: /front
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - flutter

  # ── Gradle (front/android — standalone Flutter-generated Android build) ────
  - package-ecosystem: gradle
    directory: /front/android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - flutter

  # ── Terraform (infra, infra bootstrap) ─────────────────────────────────────
  # A single entry for both directories, so that a provider update opens a single PR
  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - infra
    groups:
      terraform-providers:
        patterns:
          - "*"
