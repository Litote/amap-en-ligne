name: Update Gradle verification metadata

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'back/build.gradle.kts'
      - 'back/**/*.gradle.kts'
      - 'front/android/build.gradle.kts'
      - 'front/android/**/*.gradle.kts'

jobs:
  update-verification-metadata:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    uses: Litote/ci/.github/workflows/gradle-verification.yml@66e5eaaa94a847335a56427b1e165aa4385b0f83 # v0.4.1
    with:
      gradle-tasks: :back:check
      pr-paths: back/ front/android/
      message: 'chore: regenerate Gradle verification metadata'
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
