name: Update Gradle verification metadata

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'back/build.gradle.kts'
      - 'back/**/*.gradle.kts'
      - 'front/android/build.gradle.kts'
      - 'front/android/**/*.gradle.kts'

jobs:
  update-verification-metadata:
    name: Regenerate Gradle verification metadata
    if: github.actor == 'dependabot[bot]'
    # Pushes a commit to the PR branch on top of its current HEAD, so two runs in parallel
    # make the second ref update fail with "Update is not a fast forward". Declared at job
    # level so that runs skipped by the `if` above (triggered by our own bot commits) stay
    # out of the group; `queue: max` keeps every pending job instead of replacing it.
    concurrency:
      group: dependabot-branch-update-${{ github.head_ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Checkout the base branch (trusted code) to avoid executing untrusted workflow
      # logic. Only dependency files are then fetched from the PR branch — they
      # carry safe, predictable content from dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply dependabot dependency changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout FETCH_HEAD -- gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties gradle/verification-metadata.xml back/ front/android/

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false

      # sha256 only, like the committed file: `pgp` would flip `verify-signatures` to true
      # without exporting any key, and every CI job then fails dependency verification.
      # Run from the root build (the one that owns gradle/verification-metadata.xml) and
      # execute `:back:check` so dependencies resolved at task execution time are recorded
      # too; the root `check` would also run the front's Flutter tasks.
      - name: Regenerate verification metadata
        run: ./gradlew --write-verification-metadata sha256 --no-configuration-cache :back:check

      - name: Commit updated verification metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "No changes to verification metadata."
            exit 0
          fi
          # Use the API to get the PR branch HEAD — git rev-parse HEAD would return
          # the base branch SHA since we checked out github.base_ref, not the PR branch.
          PARENT_SHA=$(gh api "repos/$OWNER/$REPO/git/refs/heads/$BRANCH" --jq '.object.sha')
          CURRENT_TREE=$(gh api "repos/$OWNER/$REPO/git/commits/$PARENT_SHA" --jq '.tree.sha')

          base64 -w 0 gradle/verification-metadata.xml > /tmp/content.b64
          python3 -c "import json; c=open('/tmp/content.b64').read(); print(json.dumps({'content':c,'encoding':'base64'}))" > /tmp/blob-payload.json
          BLOB_SHA=$(gh api "repos/$OWNER/$REPO/git/blobs" --input /tmp/blob-payload.json --jq '.sha')

          TREE_SHA=$(jq -nc --arg base "$CURRENT_TREE" --arg path "gradle/verification-metadata.xml" --arg sha "$BLOB_SHA" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api "repos/$OWNER/$REPO/git/trees" --input - --jq '.sha')

          COMMIT_SHA=$(gh api "repos/$OWNER/$REPO/git/commits" \
            --field message="chore: regenerate Gradle verification metadata" \
            --field tree="$TREE_SHA" \
            --field "parents[]=$PARENT_SHA" \
            --jq '.sha')

          gh api "repos/$OWNER/$REPO/git/refs/heads/$BRANCH" \
            --method PATCH \
            --field sha="$COMMIT_SHA"
