name: Publish — JVM self-hosted images

# Manual only: builds and pushes the two images of the self-hosted JVM deployment
# (back/deploy/jvm/prod/docker-compose.yml) to GHCR:
#   ghcr.io/litote/amap-en-ligne-api:<tag>  — back (Ktor + Postgres + GoTrue), jlink runtime
#   ghcr.io/litote/amap-en-ligne-web:<tag>  — Flutter web app + nginx reverse proxy
# Installing an instance then only needs Docker (documentation/install/auto-hebergement.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty = VERSION_NAME from gradle.properties)'
        type: string
        default: ''
      latest:
        description: 'Also tag the images as latest'
        type: boolean
        default: true

concurrency:
  group: publish-jvm-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          tag="${INPUT_TAG:-$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2)}"
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$INPUT_LATEST" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          build-scan-publish: false

      # GITHUB_SHA is baked into BuildInfo.COMMIT (server_commit in /.well-known).
      - name: Build back distribution
        working-directory: back
        run: ./gradlew :deploy:jvm:installDist

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          working-directory: front

      - name: Install dependencies
        working-directory: front
        run: flutter pub get --enforce-lockfile

      - name: Build Web (WASM)
        working-directory: front
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          flutter build web --wasm \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=GIT_COMMIT_HASH="${GIT_SHA:0:7}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build & push images
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          api="ghcr.io/${owner}/amap-en-ligne-api"
          web="ghcr.io/${owner}/amap-en-ligne-web"
          api_tags=(-t "${api}:${TAG}")
          web_tags=(-t "${web}:${TAG}")
          if [ "$LATEST" = "true" ]; then
            api_tags+=(-t "${api}:latest")
            web_tags+=(-t "${web}:latest")
          fi
          labels=(--label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
                  --label "org.opencontainers.image.revision=${GITHUB_SHA}"
                  --label "org.opencontainers.image.version=${TAG}")
          docker buildx build --platform linux/amd64 --push "${labels[@]}" "${api_tags[@]}" back/deploy/jvm
          docker buildx build --platform linux/amd64 --push "${labels[@]}" "${web_tags[@]}" \
            -f back/deploy/jvm/prod/web.Dockerfile \
            --build-context conf=back/deploy/jvm/prod \
            front/build/web
          {
            echo "### Published"
            echo "- \`${api}:${TAG}\`"
            echo "- \`${web}:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
