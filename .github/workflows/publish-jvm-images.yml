name: Publish — JVM self-hosted images

# Manual only: builds and pushes the two images of the self-hosted JVM deployment
# (back/deploy/jvm/prod/docker-compose.yml) to GHCR, for linux/amd64 and linux/arm64, with their
# provenance and SBOM attestations:
#   ghcr.io/litote/amap-en-ligne-api:<tag>  — back (Ktor + Postgres + GoTrue), jlink runtime
#   ghcr.io/litote/amap-en-ligne-web:<tag>  — Flutter web app + nginx reverse proxy
# Installing an instance then only needs Docker (documentation/install/auto-hebergement.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty = VERSION_NAME from gradle.properties)'
        type: string
        default: ''
      latest:
        description: 'Also tag the images as latest'
        type: boolean
        default: true

concurrency:
  group: publish-jvm-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/litote/amap-en-ligne-api
  WEB_IMAGE: ghcr.io/litote/amap-en-ligne-web

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          tag="${INPUT_TAG:-$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2)}"
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$INPUT_LATEST" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25 and Gradle
        uses: Litote/ci/.github/actions/setup-gradle@15172a08495ba5ce96b92c224ede2d102174803f # v0.12.0
        with:
          cache-read-only: true

      # GITHUB_SHA is baked into BuildInfo.COMMIT (server_commit in /.well-known).
      - name: Build back distribution
        working-directory: back
        run: ./gradlew :deploy:jvm:installDist

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@15172a08495ba5ce96b92c224ede2d102174803f # v0.12.0
        with:
          working-directory: front

      - name: Install dependencies
        working-directory: front
        run: flutter pub get --enforce-lockfile

      - name: Build Web (WASM)
        working-directory: front
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          flutter build web --wasm \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=GIT_COMMIT_HASH="${GIT_SHA:0:7}"

      # the api image runs jlink and adduser in the target platform: arm64 is emulated
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.API_IMAGE }}
          # latest only when asked, even for a semver tag
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tags.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tags.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.tags.outputs.latest }}

      - name: Build & push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: back/deploy/jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tags.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tags.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.tags.outputs.latest }}

      # the web image only copies files: no emulation
      - name: Build & push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: front/build/web
          file: back/deploy/jvm/prod/web.Dockerfile
          build-contexts: conf=back/deploy/jvm/prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Summary
        env:
          API_TAGS: ${{ steps.api-meta.outputs.tags }}
          WEB_TAGS: ${{ steps.web-meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            # one tag per line
            printf '%s\n' "$API_TAGS" "$WEB_TAGS" | sed 's/.*/- `&`/'
          } >> "$GITHUB_STEP_SUMMARY"
