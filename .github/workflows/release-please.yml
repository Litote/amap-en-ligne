name: Release Please

# Maintains a running release PR from conventional commits on main.
# Merging that PR bumps the version everywhere (front/pubspec.yaml,
# gradle.properties, version.txt), updates CHANGELOG.md and tags vX.Y.Z.
#
# The GitHub App token (instead of GITHUB_TOKEN) lets CI run on the
# release PR — PRs opened with the default token never trigger workflows.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - uses: Litote/ci/.github/actions/release-please@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
