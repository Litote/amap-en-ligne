name: Release Please

# Maintains a running release PR from conventional commits on main.
# Merging that PR bumps the version everywhere (front/pubspec.yaml,
# gradle.properties, version.txt), updates CHANGELOG.md and tags vX.Y.Z.
#
# The GitHub App token (instead of GITHUB_TOKEN) lets CI run on the
# release PR — PRs opened with the default token never trigger workflows.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
