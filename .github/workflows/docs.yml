name: Docs — Publish help site

on:
  push:
    branches: [main]
    paths:
      - "documentation/guide/fr/**"
      - "site/**"
      - ".github/workflows/docs.yml"
  # The site is also built (mkdocs build --strict: broken links...) on the pull requests, without deployment.
  pull_request:
    branches: [main]
    paths:
      - "documentation/guide/fr/**"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one publish at a time (the pull request builds are cancelled by a new push).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The guide is mounted in site/docs via a symlink;
        # checkout preserves symlinks on Linux.
        with:
          persist-credentials: false

      # MkDocs Material, pinned with hashes in the action (site/install.sh installs the same versions locally)
      - uses: Litote/ci/.github/actions/setup-mkdocs@63a67e7add1b9fde6396c84399f90c9252f7b8e6 # v0.15.0

      - name: Build MkDocs
        working-directory: site
        run: mkdocs build --strict

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_build

  deploy:
    needs: build
    # GitHub Pages is not enabled on the repository yet: set the repository
    # variable PAGES_ENABLED=true (Settings → Variables) once it is.
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
