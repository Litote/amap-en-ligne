name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@15172a08495ba5ce96b92c224ede2d102174803f # v0.12.0

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@15172a08495ba5ce96b92c224ede2d102174803f # v0.12.0
    with:
      allowed-paths: ^(gradle/verification-metadata\.xml|front/pubspec\.lock)$
