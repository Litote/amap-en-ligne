name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@63a67e7add1b9fde6396c84399f90c9252f7b8e6 # v0.15.0

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@63a67e7add1b9fde6396c84399f90c9252f7b8e6 # v0.15.0
    with:
      allowed-paths: ^(gradle/verification-metadata\.xml|front/pubspec\.lock)$
