name: Deploy — Lambda (AWS)

# The automatic dev deploy is NOT triggered by `push` here: `ci.yml` calls this
# workflow (`workflow_call`) on a push to main only once the back, front and
# acceptance test jobs have passed. `pull_request` still builds the native image
# and runs `terraform plan` (no deploy); `workflow_dispatch` is the manual deploy.
on:
  workflow_call:
    inputs:
      target:
        description: 'Deployment target'
        type: string
        default: dev
    # Declared optional: environment secrets (production / prod) are resolved by
    # the jobs' `environment:` and take precedence over what the caller passes.
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      AWS_ROLE_ARN:
        required: false
      TF_VAR_COGNITO_CLIENT_ID:
        required: false
      TF_VAR_INITIAL_OWNER_EMAIL:
        required: false
      TF_VAR_INITIAL_OWNER_TEMP_PASSWORD:
        required: false
      TF_VAR_SES_FROM_EMAIL:
        required: false
  pull_request:
    branches: [main]
    paths:
      - 'back/**'
      - 'infra/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (dev = automatic on push to main; prod = manual only)'
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  # One deploy at a time per target; do not cancel in-progress deploys
  group: deploy-lambda-${{ inputs.target == 'prod' && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── GraalVM native compile ────────────────────────────────────────────────
  build-native:
    name: Build Lambda (GraalVM native)
    # arm64 runner: native-image compiles for the host platform, and the Lambda functions run on
    # Graviton (Terraform `lambda_architecture`, default arm64). Change both together.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM CE 25
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false

      - name: Compile native image
        working-directory: back
        run: ./gradlew :deploy:lambda:packageNative

      # The ZIP must match the Terraform `lambda_architecture` (arm64): fail fast rather than deploy
      # functions that cannot start.
      - name: Check native binaries are arm64
        working-directory: back/deploy/lambda/build/native/nativeCompile
        run: |
          for binary in bootstrap libaws-crt-jni.so; do
            file "$binary"
            file "$binary" | grep -q "ARM aarch64" || { echo "::error::$binary is not arm64"; exit 1; }
          done

      - name: Upload lambda.zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-zip
          path: back/deploy/lambda/build/libs/lambda.zip
          retention-days: 7

  # ── Terraform plan (PR only) ──────────────────────────────────────────────
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # Dependabot PRs cannot access Actions secrets/OIDC, so AWS auth would fail.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: build-native
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip
          path: back/deploy/lambda/build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # exact Terraform version, and init with the committed lock file only
      - name: Set up Terraform
        uses: Litote/ci/.github/actions/setup-terraform@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: Select Terraform workspace
        working-directory: infra
        run: terraform workspace select -or-create dev

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -no-color
        env:
          TF_VAR_cognito_client_id: ${{ secrets.TF_VAR_COGNITO_CLIENT_ID }}
          TF_VAR_instance_api_url: ${{ vars.INSTANCE_API_URL }}
          TF_VAR_initial_owner_email: ${{ secrets.TF_VAR_INITIAL_OWNER_EMAIL }}
          TF_VAR_initial_owner_temp_password: ${{ secrets.TF_VAR_INITIAL_OWNER_TEMP_PASSWORD }}
          TF_VAR_ses_from_email: ${{ secrets.TF_VAR_SES_FROM_EMAIL }}
          TF_VAR_ses_create_identity: ${{ vars.SES_CREATE_IDENTITY || 'true' }}

  # ── Terraform apply ───────────────────────────────────────────────────────
  # Push to main → dev. Manual dispatch → the chosen target (dev or prod).
  # The GitHub environment selects the per-target variables/secrets; prod lives
  # in a separate AWS account behind the `prod` environment's protection rules.
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-native
    environment: ${{ inputs.target == 'prod' && 'prod' || 'production' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip
          path: back/deploy/lambda/build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # exact Terraform version, and init with the committed lock file only
      - name: Set up Terraform
        uses: Litote/ci/.github/actions/setup-terraform@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: Select Terraform workspace
        working-directory: infra
        run: terraform workspace select -or-create "${{ inputs.target == 'prod' && 'prod' || 'dev' }}"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_cognito_client_id: ${{ secrets.TF_VAR_COGNITO_CLIENT_ID }}
          TF_VAR_instance_api_url: ${{ vars.INSTANCE_API_URL }}
          TF_VAR_initial_owner_email: ${{ secrets.TF_VAR_INITIAL_OWNER_EMAIL }}
          TF_VAR_initial_owner_temp_password: ${{ secrets.TF_VAR_INITIAL_OWNER_TEMP_PASSWORD }}
          TF_VAR_ses_from_email: ${{ secrets.TF_VAR_SES_FROM_EMAIL }}
          TF_VAR_ses_create_identity: ${{ vars.SES_CREATE_IDENTITY || 'true' }}

  # ── Lambda function code deploy ───────────────────────────────────────────
  deploy-function:
    name: Deploy Lambda function code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-native, terraform-apply]
    environment: ${{ inputs.target == 'prod' && 'prod' || 'production' }}
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip

      - name: Update Lambda function code
        env:
          FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip \
            --no-cli-pager

      - name: Wait for update to complete
        env:
          FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --no-cli-pager
