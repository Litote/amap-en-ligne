name: Front — Builds & Goldens

# Front analyze + codegen check + unit/widget/acceptance tests + coverage now run in the
# combined `ci.yml` `front` job (its lcov feeds the SonarCloud analysis). This workflow keeps
# only the artifact builds and golden tests, which are not coverage-related.

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/front-ci.yml'
  pull_request:
    branches: [main]
  # Allows the front-update-goldens workflow to trigger CI on its PR branch
  # (GITHUB_TOKEN cannot trigger other workflow runs — GitHub restriction).
  workflow_dispatch:

concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: front

jobs:
  # Replaces a paths filter on pull_request: a workflow that does not start leaves its required
  # checks pending forever, whereas a skipped job counts as successful.
  scope:
    name: Detect PR scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.detect-changes.outputs.has-code-changes == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/detect-changes@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0
        if: github.event_name == 'pull_request'
        id: detect-changes
        with:
          pattern: '^front/|^\.github/workflows/front-ci\.yml$'

  # ── Build Android APK ─────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java 25 must satisfy the Gradle daemon JVM criteria
      # (android/gradle/gradle-daemon-jvm.properties): no download URL,
      # so Gradle never provisions a JDK from foojay.
      # Also caches the Gradle user home used by `flutter build apk`.
      - name: Setup Java 25 and Gradle
        uses: Litote/ci/.github/actions/setup-gradle@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0
        with:
          working-directory: front

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Release uses debug keys → no keystore secrets needed.
      # --build-number keeps the versionCode of successive artifacts
      # increasing so an APK can be installed over the previous one.
      - name: Build APK (release)
        run: flutter build apk --release --build-number="${GITHUB_RUN_NUMBER}"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: front/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ── Build Web ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Web (WASM)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0
        with:
          working-directory: front

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Web (WASM)
        run: flutter build web --wasm

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: front/build/web/
          retention-days: 14

  # ── Build iOS + Golden tests ──────────────────────────────────────────────
  build-ios-goldens:
    name: Build iOS + Golden tests
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0
        with:
          working-directory: front

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS (simulator, no codesign)
        run: flutter build ios --no-codesign --simulator --debug

      - name: Golden tests
        run: |
          if [ -z "$(ls test/golden/goldens/*.png 2>/dev/null)" ]; then
            echo "No golden files found — skipping."
            echo "→ Run the 'Front — Update Golden Screenshots' workflow to generate them."
          else
            flutter test test/golden/ --tags golden --reporter=github
          fi

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: front/test/golden/failures/
          retention-days: 7
