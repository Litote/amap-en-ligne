name: Update Flutter pubspec lock

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'front/pubspec.yaml'
      - 'front/pubspec.lock'

jobs:
  # This job works on files of the pull request, so it has no secret and no write access:
  # the commit job holds the GitHub App token and executes nothing from this one.
  update-flutter-lock:
    name: Regenerate Flutter pubspec lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout the base branch to avoid executing the workflow logic of the pull request.
      # Only pubspec.yaml and pubspec.lock are then taken from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}

      - name: Apply dependabot dependency changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git checkout FETCH_HEAD -- front/pubspec.yaml front/pubspec.lock

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          working-directory: front

      # Dependabot resolves with plain `dart pub`, which ignores the Flutter SDK-vendored
      # constraints and bumps meta/test/test_api/test_core past what the pinned SDK allows.
      # That breaks `flutter pub get --enforce-lockfile` in front-ci. A plain
      # `flutter pub get` re-pins those packages to the SDK versions while preserving
      # dependabot's intended bump.
      - name: Regenerate pubspec.lock
        working-directory: front
        run: flutter pub get

      - uses: Litote/ci/.github/actions/upload-regenerated-files@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          paths: front/pubspec.lock

  commit-flutter-lock:
    name: Commit Flutter pubspec lock
    needs: update-flutter-lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # Every workflow that commits to a Dependabot branch uses this group: two commits in parallel
    # make the second ref update fail with "Update is not a fast forward". `queue: max` keeps
    # every pending job instead of replacing it.
    concurrency:
      group: dependabot-branch-update-${{ github.head_ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}

      # Only the index moves to the PR head: commit-via-api sees the changes relative to it,
      # and this job, which holds the App token, keeps the files of the PR off the disk.
      - name: Compare with the pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth 1 origin "$HEAD_SHA"
          git reset --quiet FETCH_HEAD

      - uses: Litote/ci/.github/actions/apply-regenerated-files@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          paths: front/pubspec.lock

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: Litote/ci/.github/actions/commit-via-api@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref }}
          paths: front/pubspec.lock
          message: 'chore: re-pin Flutter pubspec.lock to SDK versions'
          expected-head: ${{ github.event.pull_request.head.sha }}
