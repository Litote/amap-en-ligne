name: Update Flutter pubspec lock

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'front/pubspec.yaml'
      - 'front/pubspec.lock'

jobs:
  update-flutter-lock:
    name: Regenerate Flutter pubspec lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # Shared with the Gradle verification workflow: two commits in parallel make the second ref update fail with
    # "Update is not a fast forward". Declared at job level so that skipped runs stay out of the group.
    concurrency:
      group: dependabot-branch-update-${{ github.head_ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Checkout the base branch (trusted code) to avoid executing untrusted workflow
      # logic. Only pubspec.yaml/pubspec.lock are then fetched from the PR branch — they
      # carry safe, predictable content from dependabot, and `flutter pub get` resolves
      # dependencies without executing package code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply dependabot dependency changes
        id: pr-head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git checkout FETCH_HEAD -- front/pubspec.yaml front/pubspec.lock

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          working-directory: front

      # Dependabot resolves with plain `dart pub`, which ignores the Flutter SDK-vendored
      # constraints and bumps meta/test/test_api/test_core past what the pinned SDK allows.
      # That breaks `flutter pub get --enforce-lockfile` in front-ci. A plain
      # `flutter pub get` re-pins those packages to the SDK versions while preserving
      # dependabot's intended bump.
      - name: Regenerate pubspec.lock
        working-directory: front
        run: flutter pub get

      - uses: Litote/ci/.github/actions/commit-via-api@66e5eaaa94a847335a56427b1e165aa4385b0f83 # v0.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref }}
          paths: front/pubspec.lock
          message: 'chore: re-pin Flutter pubspec.lock to SDK versions'
          expected-head: ${{ steps.pr-head.outputs.sha }}
